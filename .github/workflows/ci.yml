name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src api app tests
      - name: Test
        run: pytest
      - name: Smoke-train (fast)
        run: python -m loan_recovery.train --fast --n-samples 3000 --regenerate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trains the model inside)
        run: docker build -t smart-loan-recovery .
      - name: Run API and hit /health
        run: |
          docker run -d -p 8000:8000 --name api smart-loan-recovery
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
